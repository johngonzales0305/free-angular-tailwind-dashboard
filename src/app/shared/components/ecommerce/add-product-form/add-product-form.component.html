<form [formGroup]="productForm" class="space-y-6">
  <!-- Image Upload Dropzone -->
  <div>
    <label class="block mb-1 text-sm font-medium dark:text-white">Product Image</label>
    
    @if (previewUrl()) {
      <!-- Image Preview Mode -->
      <div class="relative flex items-center justify-between p-3 border border-gray-300 rounded-lg dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <div class="flex items-center gap-3">
          <img [src]="previewUrl()" class="object-cover w-12 h-12 rounded-md border border-gray-200 dark:border-gray-700">
          <div>
            <p class="text-xs font-medium text-gray-700 dark:text-gray-200">Image attached</p>
            <p class="text-[11px] text-gray-400">Ready to publish</p>
          </div>
        </div>
        <button 
          type="button" 
          (click)="removeImage()" 
          class="p-1 text-gray-400 hover:text-red-500 transition rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"
          title="Remove image">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    } @else {
      <!-- Dropzone Input -->
      <label 
        (drop)="onFileDropped($event)" 
        (dragover)="onDragOver($event)"
        class="relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition border-gray-300 bg-gray-50 hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800/60">
        
        @if (isUploading()) {
          <div class="flex flex-col items-center justify-center gap-2">
            <svg class="w-6 h-6 text-brand-500 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs text-gray-500 dark:text-gray-400">Processing image...</span>
          </div>
        } @else {
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <svg class="w-8 h-8 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <p class="text-xs text-gray-500 dark:text-gray-400"><span class="font-semibold text-brand-500">Click to upload</span> or drag and drop</p>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-1">PNG, JPG, or WEBP (MAX. 5MB)</p>
          </div>
        }

        <input type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" [disabled]="isUploading()">
      </label>
    }
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
    <div>
      <label class="block mb-1 text-sm font-medium dark:text-white">Product Name</label>
      <input formControlName="name" class="w-full px-4 border border-gray-300 rounded-lg h-11 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="e.g. Monitor 24 inch">
    </div>

    <div>
      <label class="block mb-1 text-sm font-medium dark:text-white">SKU</label>
      <input formControlName="sku" class="w-full px-4 border border-gray-300 rounded-lg h-11 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="e.g. MT-240">
    </div>

    <div>
      <label class="block mb-1 text-sm font-medium dark:text-white">Price</label>
      <input type="number" formControlName="price" class="w-full px-4 border border-gray-300 rounded-lg h-11 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="0">
    </div>

    <div>
      <label class="block mb-1 text-sm font-medium dark:text-white">Stock Quantity</label>
      <div class="flex border border-gray-300 rounded-lg overflow-hidden h-11 dark:border-gray-700 dark:bg-gray-900">
        <button type="button" (click)="decrementQuantity()" class="px-4 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-white h-full transition">-</button>
        <input type="number" formControlName="stock" class="flex-1 text-center border-0 h-full dark:bg-gray-900 dark:text-white focus:outline-none">
        <button type="button" (click)="incrementQuantity()" class="px-4 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-white h-full transition">+</button>
      </div>
    </div>

    <div class="col-span-full">
      <label class="block mb-1 text-sm font-medium dark:text-white">Description</label>
      <textarea formControlName="description" rows="3" class="w-full p-4 border border-gray-300 rounded-lg dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="Product details..."></textarea>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-800">
    <app-button variant="outline" type="button" (btnClick)="cancel.emit()">Cancel</app-button>
    <app-button variant="primary" type="button" [disabled]="isUploading()" (btnClick)="onPublish()">Publish Product</app-button>
  </div>
</form>
